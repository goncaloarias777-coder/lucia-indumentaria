<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucia | Indumentaria</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✨</text></svg>">
</head>
<body>

    <!-- Header / Navegación -->
    <header class="header">
           <a href="login.html" class="btn-login">Iniciar Sesión</a>
        <a href="index.html" class="logo">LUCIA</a>
        <nav class="nav-links">
            <a href="index.html" style="font-weight: 700;">Tienda</a>
            <a href="nosotros.html">Nosotros</a>
        </nav>
        <div class="header-actions">
            <button id="btn-carrito" class="btn-carrito-trigger">Carrito (<span id="contador-carrito">0</span>)</button>
        </div>
    
    </header>

    <!-- Contenido Principal -->
    <main class="main-container">
        <!-- Buscador y Filtros -->
        <div class="filtros-container" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 15px;">
            <div class="categorias" style="display: flex; gap: 10px;">
                <button class="btn-filtro active" data-categoria="todos" style="padding: 8px 16px; border: 1px solid var(--border-color); background: var(--surface); border-radius: 6px; cursor: pointer; font-weight: 600;">Todos</button>
                <button class="btn-filtro" data-categoria="Remeras" style="padding: 8px 16px; border: 1px solid var(--border-color); background: var(--surface); border-radius: 6px; cursor: pointer; font-weight: 600;">Remeras</button>
                <button class="btn-filtro" data-categoria="Pantalones" style="padding: 8px 16px; border: 1px solid var(--border-color); background: var(--surface); border-radius: 6px; cursor: pointer; font-weight: 600;">Pantalones</button>
            </div>
            <div>
                <input type="text" id="input-buscador" placeholder="Buscar prendas..." style="padding: 8px 14px; border: 1px solid var(--border-color); border-radius: 6px; background: var(--surface); font-family: inherit; width: 220px;">
            </div>
        </div>

        <!-- Grilla de Productos -->
        <section id="contenedor-productos" class="productos-grid">
            <!-- Se carga dinámicamente desde app.js -->
        </section>
    </main>

    <!-- Modal del Carrito -->
    <div id="modal-carrito" class="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: flex-end;">
        <div class="modal-content" style="background: var(--surface); width: 100%; max-width: 400px; height: 100%; padding: 30px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: -5px 0 25px rgba(0,0,0,0.1);">
            <div>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h2>Tu Carrito</h2>
                    <span id="cerrar-carrito" style="cursor: pointer; font-size: 1.5rem; font-weight: bold;">&times;</span>
                </div>
                <div id="lista-carrito" style="overflow-y: auto; max-height: calc(100vh - 200px);"></div>
            </div>
            <div style="border-top: 1px solid var(--border-color); padding-top: 20px;">
                <div style="display: flex; justify-content: space-between; margin-bottom: 15px; font-weight: 700; font-size: 1.1rem;">
                    <span>Total:</span>
                    <span>$<span id="total-carrito">0</span></span>
                </div>
                <button id="btn-pagar-mp" class="btn" style="width: 100%;">Pagar con Mercado Pago</button>
            </div>
        </div>
    </div>

    <!-- Modal de Detalle de Producto -->
    <div id="modal-detalle" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); z-index: 2000; justify-content: center; align-items: center;">
        <div style="background: var(--surface); width: 90%; max-width: 800px; border-radius: var(--radius); padding: 30px; position: relative; display: flex; gap: 30px; flex-wrap: wrap; box-shadow: 0 20px 40px rgba(0,0,0,0.2);">
            <button id="cerrar-detalle" style="position: absolute; top: 20px; right: 20px; background: none; border: none; font-size: 1.2rem; cursor: pointer;">✕</button>
            
            <div id="detalle-img" style="flex: 1; min-height: 350px; background-size: cover; background-position: center; border-radius: 8px;"></div>
            
            <div style="flex: 1; display: flex; flex-direction: column; justify-content: space-between; min-width: 250px;">
                <div>
                    <h2 id="detalle-nombre" style="font-size: 1.5rem; font-weight: 700; margin-bottom: 10px;"></h2>
                    <p id="detalle-precio" style="font-size: 1.2rem; font-weight: 600; color: var(--text-muted); margin-bottom: 20px;"></p>
                    <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px;">Selecciona tu talle:</p>
                    <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                        <button class="btn-talle" onclick="seleccionarTalle(this)" style="padding: 8px 16px; border: 1px solid var(--border-color); background: var(--surface); border-radius: 6px; cursor: pointer; font-weight: 600;">S</button>
                        <button class="btn-talle active" onclick="seleccionarTalle(this)" style="padding: 8px 16px; border: 1px solid var(--text-main); background: var(--text-main); color: white; border-radius: 6px; cursor: pointer; font-weight: 600;">M</button>
                        <button class="btn-talle" onclick="seleccionarTalle(this)" style="padding: 8px 16px; border: 1px solid var(--border-color); background: var(--surface); border-radius: 6px; cursor: pointer; font-weight: 600;">L</button>
                    </div>
                    <a href="#" onclick="abrirGuiaTalles(); return false;" style="font-size: 0.8rem; color: var(--text-muted); text-decoration: underline;">Guía de Talles</a>
                </div>
                <button id="btn-comprar-detalle" class="btn" style="width: 100%; margin-top: 20px;">Agregar al Carrito</button>
            </div>
        </div>
    </div>

    <!-- Modal de Compra Exitosa (Ticket) -->
    <div id="modal-exito" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); z-index: 2500; justify-content: center; align-items: center;">
        <div style="background: var(--surface); width: 90%; max-width: 400px; border-radius: var(--radius); padding: 35px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.2);">
            <div style="font-size: 3rem; margin-bottom: 15px;">🎉</div>
            <h2 style="font-size: 1.4rem; font-weight: 700; margin-bottom: 10px;">¡Pago Exitoso!</h2>
            <p style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 20px;">Mercado Pago procesó tu pago correctamente. Lucia ya está preparando tu pedido.</p>
            <p style="font-size: 0.8rem; font-weight: 600; margin-bottom: 25px; background: var(--bg-color); padding: 10px; border-radius: 6px;">Orden #<span id="nro-orden"></span></p>
            <button onclick="cerrarExito()" class="btn" style="width: 100%;">Volver a la Tienda</button>
        </div>
    </div>

    <!-- Notificación Toast -->
    <div id="toast-notification">¡Acción realizada con éxito!</div>

    <script src="app.js"></script>
</body>
</html>
