<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - Panel Admin</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✨</text></svg>">
</head>
<body class="login-body">
    <div class="login-container">
        <h2>Acceso Admin</h2>
        <!-- Añadimos un id al formulario y quitamos el action -->
        <form id="form-login">
            <label>Email</label>
            <input type="email" id="email" placeholder="lucia@indumentaria.com" required>
            
            <label>Contraseña</label>
            <input type="password" id="password" placeholder="******" required>
            
            <!-- Mensaje de error oculto por defecto -->
            <p id="error-msg" style="color: #ef4444; font-size: 0.8rem; margin-bottom: 15px; display: none;">Email o contraseña incorrectos.</p>
            
            <button type="submit" class="btn" style="width: 100%;">Entrar</button>
        </form>
    </div>

    <!-- Conectamos el script de validación -->
    <script src="auth.js"></script>
</body>
</html>
